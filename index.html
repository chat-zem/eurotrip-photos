<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eurotrip do Marião</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/swiper@11/swiper-bundle.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', serif;
            height: 100vh;
            overflow: hidden;
            background: #e8e4dc;
            display: flex;
        }
        
        #map {
            flex: 1;
            height: 100vh;
            filter: saturate(0.85) brightness(0.95);
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: #4a5f7f;
            color: #d4c5a9;
            padding: 30px 50px;
            border-radius: 8px;
            border: 3px solid #c9a961;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            text-align: center;
            font-size: 18px;
            letter-spacing: 1px;
        }
        
        .right-panel {
            width: 380px;
            height: 100vh;
            background: linear-gradient(135deg, #4a5f7f 0%, #3d4f66 100%);
            border-left: 3px solid #c9a961;
            box-shadow: -10px 0 40px rgba(0,0,0,0.5);
            overflow-y: auto;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            transition: transform 0.3s ease;
        }
        
        .right-panel::-webkit-scrollbar {
            width: 8px;
        }
        
        .right-panel::-webkit-scrollbar-track {
            background: rgba(42, 58, 79, 0.5);
        }
        
        .right-panel::-webkit-scrollbar-thumb {
            background: #c9a961;
            border-radius: 4px;
        }
        
        .map-title {
            font-size: 24px;
            color: #c9a961;
            margin: 0;
            text-align: center;
            font-weight: normal;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Georgia', serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .map-subtitle {
            font-size: 13px;
            color: #d4c5a9;
            text-align: center;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }
        
        .extra-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px 0;
            border-top: 2px solid rgba(201, 169, 97, 0.3);
            border-bottom: 2px solid rgba(201, 169, 97, 0.3);
        }
        
        .extra-item {
            font-size: 13px;
            color: #d4c5a9;
            letter-spacing: 0.5px;
            text-align: center;
        }
        
        .countries-section {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .country-block {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .country-name {
            font-size: 16px;
            color: #c9a961;
            font-weight: bold;
            letter-spacing: 1.5px;
            border-bottom: 2px solid #c9a961;
            padding-bottom: 8px;
        }
        
        .city-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .city-link {
            color: #d4c5a9;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 12px;
            transition: all 0.3s ease;
            cursor: pointer;
            letter-spacing: 0.5px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .city-link:hover {
            background: rgba(201, 169, 97, 0.2);
            color: #c9a961;
            padding-left: 16px;
        }
        
        .city-count {
            color: #8a9bb0;
            font-size: 12px;
            background: rgba(42, 58, 79, 0.5);
            padding: 2px 8px;
            border-radius: 10px;
        }
        
        .mobile-toggle {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1500;
            background: linear-gradient(135deg, #c9a961 0%, #b8975a 100%);
            color: #2a3a4f;
            border: 3px solid #4a5f7f;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(201, 169, 97, 0.6);
            transition: all 0.3s ease;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .mobile-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(201, 169, 97, 0.8);
        }
        
        .mobile-toggle:active {
            transform: scale(0.95);
        }
        
        .custom-marker {
            background: #c9a961;
            width: 32px;
            height: 32px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            border: 3px solid #4a5f7f;
            box-shadow: 0 4px 12px rgba(201, 169, 97, 0.6);
            transition: all 0.3s ease;
        }
        
        .custom-marker:hover {
            transform: rotate(-45deg) scale(1.2);
            box-shadow: 0 6px 20px rgba(201, 169, 97, 0.8);
        }
        
        .custom-marker::after {
            content: '';
            width: 14px;
            height: 14px;
            background: #4a5f7f;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .multi-photo-marker {
            background: linear-gradient(135deg, #c9a961 0%, #b8975a 100%);
            color: #2a3a4f;
            border-radius: 50%;
            border: 3px solid #4a5f7f;
            box-shadow: 0 4px 12px rgba(201, 169, 97, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
        }
        
        .multi-photo-marker:hover {
            transform: scale(1.15);
            box-shadow: 0 6px 20px rgba(201, 169, 97, 0.8);
        }
        
        .leaflet-popup-content-wrapper {
            background: linear-gradient(135deg, #4a5f7f 0%, #3d4f66 100%);
            border: 3px solid #c9a961;
            border-radius: 12px;
            padding: 0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            min-width: 400px;
            max-width: 500px;
        }
        
        .leaflet-popup-content {
            margin: 0;
        }
        
        .leaflet-popup-tip {
            background: #3d4f66;
            border-left: 3px solid #c9a961;
            border-bottom: 3px solid #c9a961;
        }
        
        .photo-popup {
            text-align: center;
        }
        
        .photo-popup .location-name {
            font-size: 18px;
            color: #c9a961;
            font-weight: bold;
            padding: 20px;
            margin: 0;
            letter-spacing: 1px;
            border-bottom: 2px solid #c9a961;
            background: rgba(42, 58, 79, 0.5);
        }
        
        .photo-gallery {
            position: relative;
            padding: 15px;
        }
        
        .photo-gallery .swiper {
            width: 100%;
            height: 100%;
        }
        
        .photo-gallery .swiper-slide {
            cursor: pointer;
        }
        
        .photo-gallery img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease;
            border: 2px solid #c9a961;
            user-select: none;
            -webkit-user-drag: none;
        }
        
        .photo-gallery img:hover {
            transform: scale(1.02);
        }
        
        .swiper-button-next,
        .swiper-button-prev {
            color: #c9a961 !important;
            background: rgba(74, 95, 127, 0.9) !important;
            width: 44px !important;
            height: 44px !important;
            border-radius: 50%;
            border: 2px solid #c9a961;
            z-index: 100;
        }
        
        .swiper-button-next:after,
        .swiper-button-prev:after {
            font-size: 18px !important;
            font-weight: bold;
        }
        
        .swiper-button-disabled {
            opacity: 0.3 !important;
        }
        
        .swiper-pagination {
            z-index: 100;
            bottom: 10px !important;
        }
        
        .swiper-pagination-bullet {
            background: #d4c5a9 !important;
            opacity: 0.5;
            width: 10px !important;
            height: 10px !important;
        }
        
        .swiper-pagination-bullet-active {
            background: #c9a961 !important;
            opacity: 1;
        }
        
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        
        .lightbox.active {
            display: flex;
        }
        
        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            width: 100%;
            height: 100%;
        }
        
        .lightbox-swiper {
            width: 100%;
            height: 100%;
        }
        
        .lightbox-swiper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            color: #c9a961;
            font-size: 40px;
            cursor: pointer;
            z-index: 10001;
            background: rgba(74, 95, 127, 0.9);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #c9a961;
            transition: all 0.3s ease;
        }
        
        .lightbox-close:hover {
            transform: scale(1.1);
            background: rgba(74, 95, 127, 1);
        }
        
        .lightbox .swiper-button-next,
        .lightbox .swiper-button-prev {
            width: 60px !important;
            height: 60px !important;
        }
        
        .lightbox .swiper-button-next:after,
        .lightbox .swiper-button-prev:after {
            font-size: 30px !important;
        }
        
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            
            #map {
                width: 100%;
                height: 100vh;
            }
            
            .right-panel {
                position: fixed;
                top: 0;
                right: 0;
                width: 100%;
                height: 100vh;
                border-left: none;
                border-top: 3px solid #c9a961;
                z-index: 1400;
                transform: translateX(100%);
            }
            
            .right-panel.active {
                transform: translateX(0);
            }
            
            .mobile-toggle {
                display: flex;
            }
            
            .mobile-toggle.active {
                background: linear-gradient(135deg, #4a5f7f 0%, #3d4f66 100%);
                color: #c9a961;
            }
            
            .leaflet-popup-content-wrapper {
                min-width: 300px;
                max-width: 350px;
            }
            
            .photo-gallery img {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div id="loading">Carregando sua aventura...</div>
    
    <div id="map"></div>
    
    <button class="mobile-toggle" id="mobileToggle" onclick="togglePanel()">☰</button>
    
    <div class="right-panel" id="rightPanel">
        <h1 class="map-title">Eurotrip do Marião</h1>
        <div class="map-subtitle">4-15 de Agosto, 2025</div>
        
        <div class="extra-info">
            <span class="extra-item">6 Cidades · 3 Países · 121 Memórias</span>
            <span class="extra-item">🍺 15 marcas de cervejas diferentes</span>
            <span class="extra-item">🍹 3 tipos de Spritz</span>
        </div>
        
        <div class="countries-section">
            <div class="country-block">
                <div class="country-name">🇬🇧 Reino Unido</div>
                <ul class="city-list">
                    <li><a class="city-link" data-city="London">
                        <span>Londres</span>
                        <span class="city-count">51</span>
                    </a></li>
                    <li><a class="city-link" data-city="Edinburgh">
                        <span>Edimburgo</span>
                        <span class="city-count">13</span>
                    </a></li>
                </ul>
            </div>
            
            <div class="country-block">
                <div class="country-name">🇮🇹 Itália</div>
                <ul class="city-list">
                    <li><a class="city-link" data-city="Rome">
                        <span>Roma</span>
                        <span class="city-count">16</span>
                    </a></li>
                    <li><a class="city-link" data-city="Florence">
                        <span>Florença</span>
                        <span class="city-count">29</span>
                    </a></li>
                    <li><a class="city-link" data-city="Venice">
                        <span>Veneza</span>
                        <span class="city-count">8</span>
                    </a></li>
                </ul>
            </div>
            
            <div class="country-block">
                <div class="country-name">🇩🇪 Alemanha</div>
                <ul class="city-list">
                    <li><a class="city-link" data-city="Frankfurt">
                        <span>Frankfurt</span>
                        <span class="city-count">4</span>
                    </a></li>
                </ul>
            </div>
        </div>
    </div>
    
    <div class="lightbox" id="lightbox">
        <div class="lightbox-close" onclick="closeLightbox()">×</div>
        <div class="lightbox-content">
            <div class="lightbox-swiper swiper">
                <div class="swiper-wrapper" id="lightbox-wrapper"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-pagination"></div>
            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="https://unpkg.com/swiper@11/swiper-bundle.min.js"></script>

        let popupSwipers = {};
        let currentMap;
        let photoGroups = [];
        
        function togglePanel() {
            const panel = document.getElementById('rightPanel');
            const toggle = document.getElementById('mobileToggle');
            panel.classList.toggle('active');
            toggle.classList.toggle('active');
            
            if (panel.classList.contains('active')) {
                toggle.innerHTML = '✕';
            } else {
                toggle.innerHTML = '☰';
            }
        }
        
        window.openLightbox = function(groupIndex, photoIndex) {
            const group = photoGroups[groupIndex];
            const lightbox = document.getElementById('lightbox');
            const wrapper = document.getElementById('lightbox-wrapper');
            
            wrapper.innerHTML = group.map(photo => 
                '<div class="swiper-slide"><img src="' + photo.url + '" alt="Foto"></div>'
            ).join('');
            
            lightbox.classList.add('active');
            
            new Swiper('.lightbox-swiper', {
                initialSlide: photoIndex,
                navigation: {
                    nextEl: '.lightbox .swiper-button-next',
                    prevEl: '.lightbox .swiper-button-prev',
                },
                pagination: {
                    el: '.lightbox .swiper-pagination',
                    clickable: true,
                    dynamicBullets: true
                },
                keyboard: { enabled: true },
                loop: group.length > 1,
                grabCursor: true
            });
        };
        
        window.closeLightbox = function() {
            document.getElementById('lightbox').classList.remove('active');
        };
        
        window.addEventListener('load', function() {
            if (typeof L === 'undefined') {
                document.getElementById('loading').innerHTML = 'Erro ao carregar o mapa. Por favor, recarregue a página.';
                return;
            }
            
            document.getElementById('loading').style.display = 'none';
            
            const cityCoords = {
                'London': [51.5074, -0.1278],
                'Edinburgh': [55.9533, -3.1883],
                'Rome': [41.9028, 12.4964],
                'Florence': [43.7696, 11.2558],
                'Venice': [45.4408, 12.3155],
                'Frankfurt': [50.0465, 8.5720]
            };
            
            currentMap = L.map('map');
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(currentMap);
            
            document.querySelectorAll('.city-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const city = this.dataset.city;
                    if (cityCoords[city]) {
                        currentMap.setView(cityCoords[city], 13, { animate: true, duration: 1.5 });
                        
                        if (window.innerWidth <= 768) {
                            setTimeout(() => togglePanel(), 800);
                        }
                    }
                });
            });
            
            function groupPhotosByLocation(photos, threshold = 0.001) {
                const groups = [];
                const used = new Set();
                
                photos.forEach((photo, i) => {
                    if (used.has(i)) return;
                    
                    const group = [photo];
                    used.add(i);
                    
                    photos.forEach((other, j) => {
                        if (i !== j && !used.has(j)) {
                            const distance = Math.sqrt(
                                Math.pow(photo.lat - other.lat, 2) + 
                                Math.pow(photo.lon - other.lon, 2)
                            );
                            
                            if (distance < threshold) {
                                group.push(other);
                                used.add(j);
                            }
                        }
                    });
                    
                    groups.push(group);
                });
                
                return groups;
            }
            
            function isGif(filename) {
                return filename.toLowerCase().endsWith('.gif');
            }
            
            function createCustomIcon(count) {
                if (count > 1) {
                    return L.divIcon({
                        className: 'multi-photo-marker',
                        html: count,
                        iconSize: [45, 45],
                        iconAnchor: [22, 22],
                        popupAnchor: [0, -22]
                    });
                } else {
                    return L.divIcon({
                        className: 'custom-marker',
                        iconSize: [32, 32],
                        iconAnchor: [16, 32],
                        popupAnchor: [0, -32]
                    });
                }
            }
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeLightbox();
            });
            
            photoGroups = groupPhotosByLocation(photoData);
            
            photoGroups.forEach((group, groupIndex) => {
                const centerLat = group.reduce((sum, p) => sum + p.lat, 0) / group.length;
                const centerLon = group.reduce((sum, p) => sum + p.lon, 0) / group.length;
                const swiperId = 'swiper-' + groupIndex;
                
                let popupContent = '<div class="photo-popup">';
                
                if (group.length > 1) {
                    const gifCount = group.filter(p => isGif(p.filename)).length;
                    const photoCount = group.length - gifCount;
                    let countText = group.length + ' itens';
                    if (gifCount > 0 && photoCount > 0) {
                        countText = photoCount + ' foto' + (photoCount !== 1 ? 's' : '') + ' · ' + gifCount + ' GIF' + (gifCount !== 1 ? 's' : '');
                    } else if (gifCount > 0) {
                        countText = gifCount + ' GIF' + (gifCount !== 1 ? 's' : '');
                    } else {
                        countText = photoCount + ' foto' + (photoCount !== 1 ? 's' : '');
                    }
                    popupContent += '<div class="location-name">' + countText + ' neste local</div>';
                }
                
                popupContent += '<div class="photo-gallery"><div class="swiper ' + swiperId + '"><div class="swiper-wrapper">';
                
                group.forEach((photo, idx) => {
                    popupContent += '<div class="swiper-slide" onclick="openLightbox(' + groupIndex + ',' + idx + ')">';
                    popupContent += '<img src="' + photo.url + '" alt="Foto">';
                    popupContent += '</div>';
                });
                
                popupContent += '</div>';
                
                if (group.length > 1) {
                    popupContent += '<div class="swiper-button-next"></div>';
                    popupContent += '<div class="swiper-button-prev"></div>';
                    popupContent += '<div class="swiper-pagination"></div>';
                }
                
                popupContent += '</div></div></div>';
                
                const marker = L.marker([centerLat, centerLon], {
                    icon: createCustomIcon(group.length)
                }).addTo(currentMap);
                
                const popup = L.popup({ maxWidth: 500 }).setContent(popupContent);
                marker.bindPopup(popup);
                
                marker.on('popupopen', function() {
                    if (group.length > 1) {
                        if (popupSwipers[swiperId]) {
                            popupSwipers[swiperId].destroy(true, true);
                        }
                        
                        setTimeout(() => {
                            const swiperEl = document.querySelector('.' + swiperId);
                            
                            if (swiperEl) {
                                swiperEl.addEventListener('mouseenter', () => {
                                    currentMap.dragging.disable();
                                });
                                
                                swiperEl.addEventListener('mouseleave', () => {
                                    currentMap.dragging.enable();
                                });
                                
                                popupSwipers[swiperId] = new Swiper('.' + swiperId, {
                                    navigation: {
                                        nextEl: '.' + swiperId + ' .swiper-button-next',
                                        prevEl: '.' + swiperId + ' .swiper-button-prev',
                                    },
                                    pagination: {
                                        el: '.' + swiperId + ' .swiper-pagination',
                                        clickable: true
                                    },
                                    loop: true,
                                    keyboard: { enabled: true },
                                    allowTouchMove: true,
                                    touchRatio: 1.5,
                                    simulateTouch: true
                                });
                            }
                        }, 150);
                    }
                });
                
                marker.on('popupclose', function() {
                    if (popupSwipers[swiperId]) {
                        popupSwipers[swiperId].destroy(true, true);
                        delete popupSwipers[swiperId];
                    }
                    currentMap.dragging.enable();
                });
            });
            
            const bounds = L.latLngBounds(photoData.map(p => [p.lat, p.lon]));
            currentMap.fitBounds(bounds, { padding: [50, 50] });
        });
    </script>
